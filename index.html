<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamagotchi 電子雞</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="device">
    <div class="chain">
      <div class="chain-ring"></div>
      <div class="chain-balls">
        <span class="ball"></span><span class="ball"></span><span class="ball"></span>
        <span class="ball"></span><span class="ball"></span>
      </div>
    </div>

    <div class="egg">
      <div class="flame flame-left">
        <div class="flame-tip f1"></div>
        <div class="flame-tip f2"></div>
        <div class="flame-tip f3"></div>
      </div>
      <div class="flame flame-right">
        <div class="flame-tip f1"></div>
        <div class="flame-tip f2"></div>
        <div class="flame-tip f3"></div>
      </div>

      <div class="logo">TaMaGoTcHi</div>

      <div class="screen-frame">
        <div class="icon-row top-icons">
          <div class="screen-icon" data-idx="0" title="餵食">🍴</div>
          <div class="screen-icon" data-idx="1" title="燈光">💡</div>
          <div class="screen-icon" data-idx="2" title="遊戲">⚾</div>
          <div class="screen-icon" data-idx="3" title="治療">💉</div>
        </div>

        <div class="lcd-screen" id="lcd">
          <div class="hearts-bar" id="hearts-bar">
            <div class="hg"><span class="hl">HG</span> <span id="hunger-hearts"></span></div>
            <div class="hg"><span class="hl">HP</span> <span id="happy-hearts"></span></div>
          </div>
          <canvas id="pet-canvas" width="160" height="144"></canvas>
          <div class="lcd-overlay" id="overlay-status"></div>
          <div class="lcd-overlay" id="overlay-feed"></div>
          <div class="lcd-overlay" id="overlay-game"></div>
          <div class="lcd-overlay" id="overlay-attention"></div>
          <div class="attn-icon" id="attn-icon">!</div>
          <div class="float-emoji" id="float-emoji"></div>
          <div class="message" id="message"></div>
        </div>

        <div class="icon-row bottom-icons">
          <div class="screen-icon" data-idx="4" title="清潔">🧹</div>
          <div class="screen-icon" data-idx="5" title="管教">📢</div>
          <div class="screen-icon" data-idx="6" title="狀態">📊</div>
          <div class="screen-icon" data-idx="7" title="注意">⚠️</div>
        </div>
      </div>

      <div class="pet-info">
        <span id="pet-name">BABYTCHI</span>
        <span id="pet-age">AGE 0</span>
        <span id="pet-weight">5g</span>
      </div>

      <div class="buttons">
        <button class="round-btn" id="btn-a">A</button>
        <button class="round-btn" id="btn-b">B</button>
        <button class="round-btn" id="btn-c">C</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
